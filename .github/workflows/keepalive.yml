# Cada 3 días hace una consulta pequeña para que Supabase no pause el proyecto gratuito
# y genera los movimientos periódicos pendientes. La URL y la clave son públicas (las mismas de config.js).
name: Mantener Supabase activo
on:
  schedule:
    - cron: "17 8 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping a la base de datos
        run: |
          curl -fsS -X POST "https://xdkznwpaeviebuhwhgme.supabase.co/rest/v1/rpc/keepalive" \
            -H "apikey: sb_publishable_6MvLKKAaGgnOjq5zVqqc9g_-LclZYe2" \
            -H "Content-Type: application/json" -d '{}'
